# 导出 macOS / Windows / Linux 三个平台。
# push 到 main、PR、手动触发：运行回归测试，构建并上传为 Actions 产物。
# 推 vX.Y.Z tag：构建后创建 GitHub Release 并附上三个压缩包。
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6.2

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Godot 与导出模板
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: 下载 Godot 与导出模板
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot
          cd ~/godot
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          # 只留三个桌面平台的模板，缩小缓存
          find templates -type f ! -name 'macos.zip' ! -name 'windows_*_x86_64*.exe' \
            ! -name 'linux_*.x86_64' ! -name 'version.txt' -delete

      - name: 安装导出模板
        run: |
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          cp ~/godot/templates/* "$dest/"

      - name: 写入版本号
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          sed -i "s/^application\/short_version=.*/application\/short_version=\"$ver\"/; s/^application\/version=.*/application\/version=\"$ver\"/" export_presets.cfg

      - name: 导入项目
        run: ~/godot/godot --headless --path . --import

      - name: 怪物行为与声音回归
        timeout-minutes: 5
        run: |
          for test in hanged_one crows graves creature_budget creature_behaviors threshold_creatures encounter_walk frame_limit threshold_audio audio_perception; do
            ~/godot/godot --headless --audio-driver Dummy --path . --script "res://tests/$test.gd"
          done

      - name: 导出
        run: |
          mkdir -p export/macos export/windows export/linux
          ~/godot/godot --headless --path . --export-release "macOS" export/macos/Leviathan.zip
          ~/godot/godot --headless --path . --export-release "Windows" export/windows/Leviathan.exe
          ~/godot/godot --headless --path . --export-release "Linux" export/linux/Leviathan.x86_64
          test -s export/macos/Leviathan.zip
          test -s export/windows/Leviathan.exe
          test -s export/linux/Leviathan.x86_64

      - name: 公开安装包排除本地授权模型
        timeout-minutes: 1
        run: |
          ~/godot/godot --headless --audio-driver Dummy --path . --export-pack Linux /tmp/leviathan-public-check.pck
          cd /tmp
          ~/godot/godot --headless --audio-driver Dummy --main-pack /tmp/leviathan-public-check.pck --script res://tests/hanged_one.gd -- --public

      - name: 打包
        run: |
          name="leviathan-${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          cp export/macos/Leviathan.zip "dist/${name}-macos.zip"
          (cd export/windows && zip -q "../../dist/${name}-windows.zip" Leviathan.exe)
          (cd export/linux && chmod +x Leviathan.x86_64 && zip -q "../../dist/${name}-linux.zip" Leviathan.x86_64)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: leviathan-builds
          path: dist/*.zip
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: leviathan-builds
          path: dist

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
